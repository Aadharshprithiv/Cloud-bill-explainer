<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cloud Bill Explainer{% endblock %}</title>
  <meta name="description" content="Upload your AWS bill and get every charge explained in plain English, with estimated savings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 500: '#3b82f6',
              600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-brand-50 font-sans text-slate-800 antialiased flex flex-col">
  <header class="bg-brand-700 text-white no-print">
    <div class="mx-auto max-w-5xl px-4 py-4 flex items-center justify-between gap-4">
      <a href="{{ url_for('index') }}" class="flex items-center gap-2 font-semibold text-base sm:text-lg">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9H7Z" stroke-linejoin="round"/>
          <path d="M12 10.5v5M10.5 11.8c0-.7.7-1.3 1.5-1.3s1.5.4 1.5 1.1c0 1.4-3 .9-3 2.4 0 .7.7 1.1 1.5 1.1s1.5-.6 1.5-1.3" stroke-linecap="round"/>
        </svg>
        Cloud Bill Explainer
      </a>
      <nav class="flex items-center gap-4 text-sm text-brand-100 whitespace-nowrap">
        <a href="{{ url_for('index') }}" class="hover:text-white">Upload</a>
        <a href="{{ url_for('privacy') }}" class="hover:text-white"><span class="hidden sm:inline">How it works &amp; privacy</span><span class="sm:hidden">Privacy</span></a>
      </nav>
    </div>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="no-print border-t border-brand-100 bg-white">
    <div class="mx-auto max-w-5xl px-4 py-6 text-sm text-slate-500 flex flex-col sm:flex-row gap-2 justify-between">
      <p>Cloud Bill Explainer. Savings shown are estimates, not guarantees.</p>
      <p>Not affiliated with Amazon Web Services.</p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
