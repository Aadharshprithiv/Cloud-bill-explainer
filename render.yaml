# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cloud-bill-explainer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps memory within the free plan (pandas + a 20 MB upload);
    # threads handle concurrent requests. The long timeout covers AI explanation calls.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ANTHROPIC_API_KEY
        sync: false   # optional; Render asks for it when you create the service
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: low
